<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>GPS Link · 실시간 좌표 로그</title><link rel="stylesheet" href="/style.css"><script defer src="/logs.js"></script><style>body{overflow:auto}main.log-page{display:block;height:auto;max-width:1200px;margin:auto;padding:24px}form{display:flex;flex-wrap:wrap;gap:16px;align-items:end}form label{flex:1;min-width:220px}button{width:auto!important}nav{display:flex;gap:16px}.summary{display:flex;gap:24px;flex-wrap:wrap;padding:20px 0}.table-wrap{overflow:auto;background:white;border:1px solid #dbe5e2;border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:14px;border-bottom:1px solid #e6eeeb}th{background:#edf6f3}tr.fresh{background:#e6f8ef}#message{padding:14px;background:#edf6f3;border-radius:8px}#activity{max-height:150px;overflow:auto;font-size:13px}header{height:auto;min-height:80px;flex-wrap:wrap;gap:14px}</style></head><body><header><a class="brand" href="/">◈ GPS Link</a><nav><a href="/history.html">이동 경로</a><a href="/admin.html">관리자</a></nav></header><main class="log-page"><h1>실시간 좌표 로그</h1><p>30초마다 확인합니다. 실제 수신된 좌표만 기록하며, 새 데이터가 없으면 중복 행을 만들지 않습니다.</p><form id="login"><label>장치 ID<input id="device" value="l450061222243141" required maxlength="40" pattern="[a-zA-Z0-9_-]+"></label><label>관리자 인증키<input id="key" type="password" autocomplete="off" required></label><button class="primary" type="submit">로그 확인 시작</button></form><div class="summary"><button id="refresh" class="secondary" disabled>지금 갱신</button><button id="stop" class="secondary" disabled>중지 · 로그아웃</button><button id="csv" class="secondary" disabled>현재 로그 CSV 저장</button></div><p id="message" role="status">관리자 인증 후 로그를 조회할 수 있습니다.</p><div class="summary"><span>마지막 조회: <strong id="checked">—</strong></span><span>마지막 수신: <strong id="received">—</strong></span><span>다음 확인: <strong id="countdown">—</strong></span></div><div class="table-wrap"><table><thead><tr><th>수신 시각 (한국)</th><th>장치 ID</th><th>위도 LAT</th><th>경도 LON</th></tr></thead><tbody id="rows"></tbody></table></div><p>최근 500건을 최신 순서로 표시합니다. 서버는 장치별 최근 10,000건을 보관합니다. 이전 기록은 <a href="/history.html">이동 이력</a>에서 조회하세요.</p><details open><summary>자동 조회 상태 (최근 20회)</summary><ul id="activity"></ul></details></main></body></html>
