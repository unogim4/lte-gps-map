<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>GPS Link · 로그인</title><link rel="stylesheet" href="/style.css"><script defer src="/auth.js"></script></head>
<body class="auth-page">
<header><a class="brand" href="/">◈ <strong>GPS<span>Link</span></strong></a><span class="head-label">LOCATION CONSOLE</span><span class="secure">● 회원 전용</span></header>
<main class="auth-main">
 <form id="auth-form" class="auth-card" novalidate>
  <div class="eyebrow" id="auth-eyebrow">MEMBER LOGIN</div>
  <h1 id="auth-title">로그인</h1>
  <p class="intro" id="auth-intro">회원만 위치 지도를 볼 수 있습니다.</p>
  <label>아이디<input id="auth-username" name="username" autocomplete="username" maxlength="20" required placeholder="영문 소문자·숫자·밑줄 3~20자"></label>
  <label>비밀번호<input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="8자 이상"></label>
  <div id="signup-fields" hidden>
   <label>비밀번호 확인<input id="auth-password2" type="password" autocomplete="new-password" maxlength="128" placeholder="같은 비밀번호를 한 번 더"></label>
   <label>가입 코드 (받은 경우만)<input id="auth-code" autocomplete="off" maxlength="128" placeholder="없으면 비워 두세요"></label>
  </div>
  <button id="auth-submit" class="primary auth-submit" type="submit">로그인</button>
  <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
  <button id="auth-switch" class="secondary" type="button">처음이신가요? 회원가입</button>
 </form>
</main>
<footer>GPS Link <span>회원 전용 위치 지도</span><span>WGS84 / DECIMAL DEGREES</span></footer>
</body></html>
